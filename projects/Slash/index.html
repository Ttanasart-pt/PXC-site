    const pxc_canvas_under = document.getElementById("pxc_canvas_under").getContext("2d");

    function drawNode(title, url, x, y, w, h, thumb="") {
        const node = document.createElement("div");
        node.className = "node";
        node.style.top = y + "px";
        node.style.left = x + "px";
        node.style.width = w + "px";
        node.style.height = h + "px";

        if(thumb !== "") {
            const nodeThumb = document.createElement("div");
            nodeThumb.className = "node-thumb";
            nodeThumb.style.backgroundImage = "url('" + thumb + "')";
            node.appendChild(nodeThumb);
        }

        const nodeTitle = document.createElement("div");
        nodeTitle.className = "node-title";
        nodeTitle.innerHTML = "<a href='" + url + "'>" + title + "</a>";
        node.appendChild(nodeTitle);

        pxc_nodecontent.appendChild(node);
    }

    function connect(x0, y0, x1, y1) {
        x0 *= 2;
        y0 *= 2;
        x1 *= 2;
        y1 *= 2;

        pxc_canvas_under.strokeStyle = "#6d6d81";
        
        pxc_canvas_under.beginPath();
        pxc_canvas_under.moveTo(x0, y0);
        pxc_canvas_under.lineTo(x1, y1);
        pxc_canvas_under.stroke();
        pxc_canvas_under.closePath();
        
        pxc_canvas_over.fillStyle   = "#6d6d81";

        pxc_canvas_over.beginPath();
        pxc_canvas_over.arc(x0, y0, 6, 0, 2 * Math.PI);
        pxc_canvas_over.arc(x1, y1, 6, 0, 2 * Math.PI);
        pxc_canvas_over.fill();
        pxc_canvas_over.closePath();

    }

    function drawPolygon(points, color) {
        if (points.length < 2) return;

        pxc_canvas_under.strokeStyle = color + "88";
        
        pxc_canvas_under.beginPath();
        pxc_canvas_under.moveTo(points[0][0] * 2, points[0][1] * 2);
        for (let i = 1; i < points.length; i++)
            pxc_canvas_under.lineTo(points[i][0] * 2, points[i][1] * 2);
        pxc_canvas_under.closePath();
        pxc_canvas_under.stroke();

        pxc_canvas_under.fillStyle = color + "08";
        pxc_canvas_under.fill();

    }
