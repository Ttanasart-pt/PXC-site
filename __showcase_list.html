        <div class="description">
            <div class="info">
                <a href="{{LINK}}" class="project-title">{{TITLE}}</a>
                <p class="project-auth">{{AUTHOR}}</p>
                <p class="project-desc">{{DESC}}</p>

            <div class="badge">
                <p>{{TYPE}}</p>
            </div>
            <!-- <div class="links">
                <a href="#">L</a>
            </div> -->

    <div class="screenshots">

        </div>
    </div>
</div>
