<script>    
    let screenGroup = [];
    let screenIndex = 0;

    var modal   = document.getElementById("preview-modal");
    var img     = document.getElementById("preview-img");
    var caption = document.getElementById("caption");
    var count   = document.getElementById("count");

    var close   = document.getElementById("close");
    var prev    = document.getElementById("prev");
    var next    = document.getElementById("next");

    function showPreview(_img) {
        var _dat = screenMap[_img.src];
        screenGroup = _dat[0];
        screenIndex = _dat[1];

        img.src = screenGroup[screenIndex];
        count.innerText = (screenIndex+1) + "/" + screenGroup.length;
        modal.style.display = "block";
    }

    function prevPreview() {
        screenIndex = (screenIndex - 1 + screenGroup.length) % screenGroup.length;
        img.src = screenGroup[screenIndex];
        count.innerText = (screenIndex+1) + "/" + screenGroup.length;
    }

    function nextPreview() {
        screenIndex = (screenIndex + 1) % screenGroup.length;
        img.src = screenGroup[screenIndex];
        count.innerText = (screenIndex+1) + "/" + screenGroup.length;
    }

    img.onclick   = function() { modal.style.display = "block"; }
    
    close.onclick = function() { modal.style.display = "none"; }
    prev.onclick  = function() { prevPreview(); }
    next.onclick  = function() { nextPreview(); }

    let  screenMap  = {};
    let  screenList = [];
    var _screenList = document.getElementsByClassName("screenshots-list");

    for(var i = 0; i < _screenList.length; i++) {
        var _screenShots = _screenList[i].getElementsByTagName("img");
        var  screenShots = [];

        for(var j = 0; j < _screenShots.length; j++) {
            var _scr = _screenShots[j];
            screenShots.push(_scr.src);
            _scr.onclick = function() { showPreview(this); }

            screenMap[_scr.src] = [screenShots,j];
        }
        screenList.push(screenShots);
    }

    function toggleExpands(el) {
        el.parentElement.classList.toggle("expanded");
    }
    
    function expandsDisplay() {
        let r = document.querySelector(':root');
        let list_size = getComputedStyle(r).getPropertyValue('--list-size');

        let desc = document.getElementsByClassName("description");
        let expd = document.getElementsByClassName("expands");

        
        for(let i = 0; i < desc.length; i++) {
            var _desc = desc[i];
            let max_height = _desc.offsetHeight * .75;
            
            var _desc_container = _desc.getElementsByClassName("project-desc");
            var _desc_height    = _desc_container[0].offsetHeight;

            console.log(max_height, _desc_height)

            if(_desc_height > max_height) expd[i].style.display = "block";
            else expd[i].style.display = "none";
        }
    }

    expandsDisplay();
</script>
